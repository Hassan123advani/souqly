<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0E5E5A" />
    <title>You're offline — Souqly</title>
    <style>
      :root { --bg: #fbf8f3; --fg: #211d19; --muted: #635b51; --teal: #0e5e5a; --saffron: #f2a93b; --card: #fff; --border: #e7e0d4; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0f1716; --fg: #eceFea; --muted: #a5b2ac; --teal: #5cc2b9; --card: #15201e; --border: #293835; }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg); color: var(--fg); display: grid; place-items: center; padding: 24px;
        background-image: radial-gradient(60% 50% at 50% 0%, rgba(242, 169, 59, 0.14), transparent 70%);
      }
      main { max-width: 440px; text-align: center; background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 40px 28px; box-shadow: 0 18px 40px -12px rgba(46, 34, 18, 0.18); }
      svg { width: 72px; height: 72px; }
      .lantern { animation: glow 3s ease-in-out infinite; transform-origin: center; }
      @keyframes glow { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .lantern { animation: none; } }
      h1 { font-size: 24px; margin: 20px 0 8px; letter-spacing: -0.02em; }
      p { color: var(--muted); line-height: 1.6; margin: 0 0 8px; }
      .ar { font-family: 'Readex Pro', Tahoma, sans-serif; direction: rtl; }
      .ur { font-family: 'Noto Nastaliq Urdu', 'Readex Pro', Tahoma, serif; direction: rtl; line-height: 2.2; }
      button { margin-top: 20px; height: 48px; padding: 0 28px; border: 0; border-radius: 12px; background: #0e5e5a; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 2px solid var(--saffron); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path d="M9 57.5V30.5C9 17.6 18.6 8.6 32 2.5c13.4 6.1 23 15.1 23 28v27c0 2.2-1.8 4-4 4H13c-2.2 0-4-1.8-4-4Z" fill="#0E5E5A" />
        <path d="M41.5 27c-2.6-4-17.5-5-17.5 3.6 0 8.4 17 6 17 15.1 0 8.6-15.6 8.6-18.5 3.6" fill="none" stroke="#F2A93B" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
        <circle class="lantern" cx="32" cy="15.5" r="2.6" fill="#F2A93B" />
      </svg>
      <h1>The souq is out of reach</h1>
      <p>You're offline right now. Check your connection — your cart and wishlist are safe and will be waiting.</p>
      <p class="ur" lang="ur">آپ اس وقت آف لائن ہیں۔ کنکشن بحال ہوتے ہی دوبارہ کوشش کریں۔</p>
      <p class="ar" lang="ar">أنت غير متصل حاليًا. أعد المحاولة عند عودة الاتصال.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
